[project]
name = "ecg-legendre"
version = "0.1.0"
description = "Heartbeat classification with Legendre coefficients, evaluated on patients never seen"
readme = "README.md"
authors = [
    { name = "Yanis André", email = "contact@yanis-andre.fr" }
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.3",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "wfdb>=4.3.1",
]

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
